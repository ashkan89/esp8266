[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
lib_deps =
  esp32async/ESPAsyncTCP@2.0.0
  marvinroger/AsyncMqttClient@0.9.0
  bblanchon/ArduinoJson@6.21.5
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BusIO@1.17.4
build_flags = -D MQTT_MAX_TOPIC_LENGTH=128
build_src_flags = -Wall -Wextra
extra_scripts = pre:scripts/configure.py
monitor_speed = 115200
upload_speed = 115200

[env:diagnostic]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -D CONTROLLER_SERIAL_DIAGNOSTICS=1
upload_port = COM9

[env:ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = ${sysenv.ESP_OTA_HOST}
upload_flags = --auth=${sysenv.ESP_OTA_PASSWORD}
